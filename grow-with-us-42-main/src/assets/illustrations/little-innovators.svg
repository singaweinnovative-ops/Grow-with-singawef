<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of young children's activities: building blocks, a friendly robot, a storybook and art">
  <defs>
    <linearGradient id="li-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBF3E4" />
      <stop offset="100%" stop-color="#F3E4C8" />
    </linearGradient>
    <linearGradient id="li-robot-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E4B25C" />
      <stop offset="100%" stop-color="#C98A3E" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#li-sky)" />

  <circle cx="670" cy="110" r="90" fill="#EFD9A6" opacity="0.55" />
  <circle cx="110" cy="90" r="60" fill="#EFD9A6" opacity="0.5" />

  <!-- sparkles -->
  <g fill="#C98A3E" opacity="0.7">
    <path d="M120 190 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z" />
    <path d="M700 260 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z" />
    <path d="M660 470 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 z" />
  </g>

  <!-- ground -->
  <path d="M0 520 Q400 480 800 520 L800 600 L0 600 Z" fill="#DDBB84" opacity="0.4" />

  <!-- storybook (left) -->
  <g transform="translate(90 380)">
    <path d="M0 60 Q70 30 140 60 L140 110 Q70 90 0 110 Z" fill="#7A9E6E" />
    <path d="M140 60 Q210 30 280 60 L280 110 Q210 90 140 110 Z" fill="#8FB27F" />
    <path d="M140 60 L140 110" stroke="#5F7E52" stroke-width="4" />
    <path d="M20 78 Q70 60 120 78" stroke="#F7EFDC" stroke-width="5" fill="none" stroke-linecap="round" />
    <path d="M20 92 Q70 76 110 92" stroke="#F7EFDC" stroke-width="5" fill="none" stroke-linecap="round" />
    <path d="M160 78 Q210 60 260 78" stroke="#F7EFDC" stroke-width="5" fill="none" stroke-linecap="round" />
    <path d="M160 92 Q210 76 250 92" stroke="#F7EFDC" stroke-width="5" fill="none" stroke-linecap="round" />
  </g>

  <!-- building blocks (center-left) -->
  <g transform="translate(300 300)">
    <rect x="0" y="140" width="90" height="90" rx="10" fill="#C1543A" />
    <text x="45" y="196" font-family="Georgia, serif" font-size="46" fill="#FBF3E4" text-anchor="middle">A</text>
    <rect x="100" y="140" width="90" height="90" rx="10" fill="#3E7A8C" />
    <text x="145" y="196" font-family="Georgia, serif" font-size="46" fill="#FBF3E4" text-anchor="middle">B</text>
    <rect x="50" y="40" width="90" height="90" rx="10" fill="#E4B25C" />
    <text x="95" y="96" font-family="Georgia, serif" font-size="46" fill="#40311C" text-anchor="middle">C</text>
  </g>

  <!-- crayon (front) -->
  <g transform="translate(370 480) rotate(-18)">
    <rect x="0" y="0" width="150" height="34" rx="8" fill="#C1543A" />
    <path d="M150 0 L178 17 L150 34 Z" fill="#8C3A28" />
    <rect x="0" y="0" width="150" height="34" rx="8" fill="none" stroke="#8C3A28" stroke-width="2" opacity="0.4" />
  </g>
  <path d="M410 545 q40 -30 90 -10" stroke="#C1543A" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7" />

  <!-- friendly robot (right) -->
  <g transform="translate(500 250)">
    <rect x="-6" y="-46" width="12" height="34" rx="6" fill="#8C6A3A" />
    <circle cx="0" cy="-56" r="14" fill="#E4B25C" />
    <rect x="-70" y="-20" width="140" height="120" rx="26" fill="url(#li-robot-body)" />
    <circle cx="-30" cy="30" r="16" fill="#FBF3E4" />
    <circle cx="30" cy="30" r="16" fill="#FBF3E4" />
    <circle cx="-30" cy="30" r="7" fill="#40311C" />
    <circle cx="30" cy="30" r="7" fill="#40311C" />
    <path d="M-24 66 Q0 84 24 66" stroke="#40311C" stroke-width="5" fill="none" stroke-linecap="round" />
    <rect x="-96" y="6" width="26" height="56" rx="13" fill="#C98A3E" />
    <rect x="70" y="6" width="26" height="56" rx="13" transform="rotate(-25 83 34)" fill="#C98A3E" />
    <rect x="-46" y="100" width="30" height="46" rx="10" fill="#8C6A3A" />
    <rect x="16" y="100" width="30" height="46" rx="10" fill="#8C6A3A" />
  </g>
</svg>
