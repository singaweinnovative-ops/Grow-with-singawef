<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a circle of women supporting one another">
  <defs>
    <linearGradient id="sh-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8ECF6" />
      <stop offset="100%" stop-color="#EED7EA" />
    </linearGradient>
    <radialGradient id="sh-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C778BE" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#C778BE" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sh-bg)" />
  <circle cx="400" cy="330" r="230" fill="url(#sh-glow)" />

  <!-- gentle ring -->
  <circle cx="400" cy="330" r="170" fill="none" stroke="#9B3F8F" stroke-width="3" stroke-dasharray="4 10" opacity="0.5" />

  <!-- figures arranged in a circle, simple silhouettes -->
  <g fill="#9B3F8F">
    <!-- top -->
    <g transform="translate(400 150)">
      <circle cx="0" cy="0" r="26" />
      <path d="M-34 90 Q0 40 34 90 L30 110 L-30 110 Z" />
    </g>
    <!-- upper right -->
    <g transform="translate(560 230)">
      <circle cx="0" cy="0" r="24" />
      <path d="M-30 82 Q0 36 30 82 L26 100 L-26 100 Z" />
    </g>
    <!-- lower right -->
    <g transform="translate(520 400)">
      <circle cx="0" cy="0" r="24" />
      <path d="M-30 82 Q0 36 30 82 L26 100 L-26 100 Z" />
    </g>
    <!-- lower left -->
    <g transform="translate(280 400)">
      <circle cx="0" cy="0" r="24" />
      <path d="M-30 82 Q0 36 30 82 L26 100 L-26 100 Z" />
    </g>
    <!-- upper left -->
    <g transform="translate(240 230)">
      <circle cx="0" cy="0" r="24" />
      <path d="M-30 82 Q0 36 30 82 L26 100 L-26 100 Z" />
    </g>
  </g>

  <!-- centre heart -->
  <g transform="translate(400 330)" fill="#F3D9EF">
    <path d="M0 22 C-24 0 -40 -18 -22 -34 C-10 -44 0 -34 0 -24 C0 -34 10 -44 22 -34 C40 -18 24 0 0 22 Z" />
  </g>

  <!-- sparkles -->
  <g fill="#9B3F8F" opacity="0.6">
    <path d="M120 140 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z" />
    <path d="M660 470 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z" />
  </g>
</svg>
